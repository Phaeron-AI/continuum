model:
  d_model: 128
  d_state: 16
  d_conv: 4
  n_layers: 4
  ffn_mult: 4
  mixer: mamba
  action_conditioning: inline
 
train:
  max_steps: 8000
  lr: 0.0003
  log_every: 100
  checkpoint_every: 2000
  device: auto
  amp: true
  grad_clip: 1.0
  context_noise_prob: 0.15
  checkpoint_dir: checkpoints/world_model/phase3_player
 
data:
  cache_dir: data/token_cache/phase1_v2
  context_frames: 4
  num_actions: 5
  batch_size: 32
  num_workers: 4
  eval_fraction: 0.1
  split_seed: 0
  eval_on_finish: true